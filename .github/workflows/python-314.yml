name: Python 3.14 (experimental)

# Diagnostic job for issue #1: dependencies still declare <3.14, so install with the cap ignored.
# continue-on-error keeps this from gating until the dependency wheels are verified.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  python-3-14:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ffmpeg and espeak-ng (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install ffmpeg and espeak-ng (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg espeak-ng
      - name: Install CPU-only torch (Linux)
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install bookvox, ignoring the dependency Python cap
        run: pip install --ignore-requires-python .
      - name: Check it runs as script
        run: bookvox --help
      - name: Download test epub
        run: curl -fsSL -o book.epub https://github.com/daisy/epub-accessibility-tests/releases/download/fundamental-2.0/Fundamental-Accessibility-Tests-Basic-Functionality-v2.0.0.epub
      - name: Create audiobook
        run: bookvox book.epub
      - name: Check an m4b was produced
        run: test -s book.m4b && ls -lah book.m4b
