[project]
name = "bookvox"
version = "0.5.2"
description = "Generate audiobooks from e-books (epub to wav/m4b)"
authors = [
    { name = "Joseph", email = "jkhassan95@gmail.com" }
]
maintainers = [
    { name = "Joseph", email = "jkhassan95@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "ebooklib (>=0.18,<0.19)",
    "soundfile (>=0.13.1,<0.14.0)",
    "pick (>=2.4.0,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "spacy (>=3.8.3,<4.0.0)",
    "kokoro (==0.9.4)",
    "misaki[zh] (>=0.9.2)",
    "tabulate (>=0.9.0,<0.10.0)",
    "epub-toc (>=1.0.0,<2.0.0)",
    "qwen-tts (>=0.1.1,<0.2.0)",
]
exclude = [
    "imgs",
    "test",
    "*.wav",
    "*.m4b",
    "cover",
    "chapters.txt"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Repository = "https://github.com/JHCodeQuest/bookvox"
Issues = "https://github.com/JHCodeQuest/bookvox/issues"
"Upstream project" = "https://github.com/santinic/audiblez"

[project.scripts]
bookvox = "bookvox.cli:cli_main"
bookvox-ui = "bookvox.ui:main"

[tool.poetry.group.dev.dependencies]
deptry = "^0.23.0"
